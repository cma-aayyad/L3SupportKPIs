<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L2/L3 Support KPIs</title>
<style>
/* ---------- tokens (swap --brand / --accent for your existing branding colours) ---------- */
:root {
  color-scheme: light;
  --brand: #0b2d6b; --brand-2: #163f8c; --brand-ink: #ffffff; --accent: #e2001a;
  --bg: #f2f4f8; --surface: #ffffff; --ink: #17213a; --muted: #5a6680; --line: #dbe1ec; --soft: #eef2f8;
  --good: #1d8a4b; --bad: #c62828; --warn: #a86300;
  --s-requested: #8b95a9; --s-pending: #e3a21a; --s-progress: #2f6fd6; --s-done: #1d8a4b; --s-unknown: #c5cbd6;
  --radius: 10px; --radius-sm: 6px;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); }
a { color: var(--brand-2); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #7aa7ff; outline-offset: 2px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ---------- header ---------- */
.top { background: var(--brand); color: var(--brand-ink); border-bottom: 4px solid var(--accent); }
.top-inner { max-width: 1400px; margin: 0 auto; padding: 14px 20px 0; }
.top-row { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.title { margin: 0; font-size: 1.35rem; font-weight: 650; letter-spacing: .2px; }
.title small { font-weight: 400; opacity: .75; font-size: .85rem; margin-left: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid transparent; border-radius: var(--radius-sm); padding: 7px 12px; cursor: pointer; background: var(--surface); color: var(--ink); white-space: nowrap; }
.btn:hover { filter: brightness(.96); }
.btn-ghost { background: transparent; color: inherit; border-color: rgba(255,255,255,.45); }
.btn-ghost:hover { background: rgba(255,255,255,.1); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-line { background: var(--surface); border-color: var(--line); }
.top select { background: var(--brand-2); color: #fff; border: 1px solid rgba(255,255,255,.45); border-radius: var(--radius-sm); padding: 6px 8px; max-width: 100%; }
.banner { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 10px; font-size: .88rem; opacity: .95; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .78rem; font-weight: 600; }
.badge-local { background: #ffe08a; color: #4a3500; }
.badge-warn { background: var(--accent); color: #fff; text-decoration: none; }
.notice { background: #fff4d6; color: #4a3500; border-radius: var(--radius-sm); padding: 6px 10px; font-size: .85rem; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 12px; }
.tab { color: #dfe7f7; text-decoration: none; padding: 8px 14px; border-radius: var(--radius-sm) var(--radius-sm) 0 0; font-weight: 500; }
.tab:hover { background: rgba(255,255,255,.08); color: #fff; }
.tab[aria-current="page"] { background: var(--bg); color: var(--brand); }

/* ---------- layout ---------- */
main { max-width: 1400px; margin: 0 auto; padding: 16px 20px 40px; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 8px; align-items: end; margin-bottom: 16px; }
.filters label { display: grid; gap: 2px; font-size: .8rem; color: var(--muted); min-width: 0; }
.filters select, .filters input { width: 100%; min-width: 0; padding: 7px 8px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 14px; }
.chip { background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: .82rem; display: inline-flex; gap: 4px; align-items: center; }
.chip button { border: 0; background: transparent; cursor: pointer; padding: 0 6px; font-size: 1rem; line-height: 1; }
section.block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; min-width: 0; }
section.block > h2 { margin: 0 0 12px; font-size: 1.02rem; font-weight: 650; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.grid-2 > section.block { margin-bottom: 0; }
.stack > * + * { margin-top: 16px; }

/* ---------- KPI cards ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 128px), 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--brand); border-radius: var(--radius-sm); padding: 10px 12px; min-width: 0; }
.kpi .v { font-size: 1.65rem; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: .84rem; color: var(--muted); }
.kpi .d { font-size: .8rem; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.d.good { color: var(--good); } .d.bad { color: var(--bad); } .d.neutral { color: var(--muted); }

/* ---------- domain cards: the stacked status bar is the signature element ---------- */
.domains { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; margin-bottom: 16px; }
.dcard { display: flex; flex-direction: column; justify-content: flex-start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; cursor: pointer; min-width: 0; }
.dcard:hover { border-color: var(--brand-2); }
.dcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dcard h3 { margin: 0; font-size: 1rem; display: flex; justify-content: space-between; gap: 8px; }
.dcard .big { font-size: 1.9rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.dcard .meta { font-size: .83rem; color: var(--muted); }
.sbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--soft); margin: 10px 0 6px; }
.sbar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); }
table { border-collapse: collapse; width: 100%; font-size: .87rem; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { background: var(--soft); font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
th[data-sort] { cursor: pointer; }
th[data-sort]:hover { color: var(--brand-2); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #f7f9fd; }
tr.sub td:first-child { padding-left: 26px; }
tr.dom td { font-weight: 600; background: #fafbfe; }
.age-hot { background: #fde7e7; color: var(--bad); font-weight: 600; border-radius: 4px; padding: 1px 6px; }
.status { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .78rem; color: #fff; white-space: nowrap; }
td.task { min-width: 220px; }
td.nowrap { white-space: nowrap; }
.flag { color: var(--warn); font-size: .78rem; }

/* ---------- charts ---------- */
.chart { position: relative; height: 270px; }
.chart.tall { height: 340px; }
.chart-msg { padding: 24px; text-align: center; color: var(--muted); }

/* ---------- lists / quality ---------- */
.toplist { list-style: none; margin: 0; padding: 0; }
.toplist li { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.toplist li:last-child { border-bottom: 0; }
.toplist .age { font-size: 1.25rem; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--bad); }
.qlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.qitem { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); padding: 12px; cursor: pointer; }
.qitem .c { font-size: 1.5rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.qitem.ok .c { color: var(--good); } .qitem.warn .c { color: var(--warn); }
.qitem[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.qitem small { display: block; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }

/* ---------- empty / drop ---------- */
.empty { text-align: center; padding: 56px 20px; background: var(--surface); border: 2px dashed var(--line); border-radius: var(--radius); }
.empty h2 { margin: 0 0 6px; }
body.dragging main { outline: 3px dashed var(--accent); outline-offset: -8px; }
dialog { border: 0; border-radius: var(--radius); max-width: min(560px, 94vw); padding: 20px; }
dialog::backdrop { background: rgba(10,20,40,.45); }
dialog code { background: var(--soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: var(--radius-sm); z-index: 20; max-width: 92vw; }
.print-head { display: none; }

@media (max-width: 640px) {
  .top-inner, main { padding-left: 12px; padding-right: 12px; }
  .title small { display: block; margin: 2px 0 0; }
  .tab { padding: 7px 10px; }
  .kpi .v { font-size: 1.4rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- print: A4 landscape, controls hidden ---------- */
@page { size: A4 landscape; margin: 10mm; }
@media print {
  html, body { background: #fff; font-size: 11px; }
  .no-print, .top, .filters, .chips, .toast { display: none !important; }
  main { max-width: none; padding: 0; }
  .print-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid var(--accent); margin-bottom: 8px; padding-bottom: 4px; }
  .print-head h1 { margin: 0; font-size: 1.4rem; color: var(--brand); }
  section.block, .kpi, .dcard { break-inside: avoid; }
  section.block { padding: 8px 10px; margin-bottom: 8px; }
  .kpis { grid-template-columns: repeat(9, 1fr); gap: 6px; margin-bottom: 8px; }
  .kpi .v { font-size: 1.25rem; }
  .domains { grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
  .dcard { padding: 8px; } .dcard .big { font-size: 1.3rem; }
  .table-wrap { overflow: visible; border: 0; }
  th, td { padding: 3px 6px; }
  .print-cols { display: grid; grid-template-columns: 3fr 2fr; gap: 8px; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
<!-- Shared data. A missing file simply means "nothing published yet". -->
<script src="data/latest.js"></script>
<script src="data/history/index.js"></script>
<script src="core.js"></script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <h1 class="title">L2/L3 Support KPIs <small>L3 Support unit</small></h1>
      <div class="actions no-print">
        <label class="hidden" for="period">Period</label>
        <select id="period" aria-label="Period"></select>
        <button class="btn btn-primary" id="btn-upload" type="button">Upload tracker</button>
        <button class="btn btn-ghost" id="btn-publish" type="button">Publish snapshot</button>
        <button class="btn btn-ghost" id="btn-print" type="button">Print / PDF</button>
        <button class="btn btn-ghost" id="btn-clear" type="button">Clear local data</button>
        <input type="file" id="file" accept=".xlsx,.xlsm,.xls" hidden>
      </div>
    </div>
    <div class="banner" id="banner" aria-live="polite"></div>
    <nav class="tabs no-print" id="tabs" aria-label="Views"></nav>
  </div>
</header>

<main>
  <div class="print-head"><h1>L2/L3 Support KPIs</h1><span id="print-meta"></span></div>
  <div class="filters no-print" id="filters"></div>
  <div class="chips no-print" id="chips"></div>
  <div id="view"></div>
</main>

<dialog id="dlg"></dialog>

<script>
'use strict';
/* ========================================================================= */
/* CONFIG                                                                    */
/* ========================================================================= */
const C = window.TrackerCore;
const CFG = C.CONFIG;
// To make ticket IDs clickable, set this (or CFG.serviceNowBaseUrl in core.js):
// CFG.serviceNowBaseUrl = 'https://<instance>.service-now.com';

const LIBS = {
  // Vendored copies come first (run `npm run vendor`). The pinned CDN fallback keeps the page usable
  // before vendoring; set allowCdnFallback to false for strict no-CDN deployments.
  allowCdnFallback: true,
  xlsx: { global: 'XLSX', local: 'vendor/xlsx.full.min.js', cdn: 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js' },
  chart: { global: 'Chart', local: 'vendor/chart.umd.js', cdn: 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js' },
};
const VIEWS = [
  { id: 'overview', label: 'Overview' }, { id: 'domain', label: 'Domains' }, { id: 'application', label: 'Applications' },
  { id: 'team', label: 'Team' }, { id: 'trends', label: 'Trends' }, { id: 'quality', label: 'Data quality' }, { id: 'print', label: 'Print' },
];
const FILTER_KEYS = ['domain', 'app', 'status', 'type', 'person', 'q', 'qc'];
const STATUS_COLOR = { Requested: '--s-requested', Pending: '--s-pending', 'In Progress': '--s-progress', Done: '--s-done', Unknown: '--s-unknown' };
const KPI_CARDS = [
  { key: 'total', label: 'Total tasks' },
  { key: 'done', label: 'Done' },
  { key: 'open', label: 'Open' },
  { key: 'completionRate', label: 'Completion rate', fmt: 'pct' },
  { key: 'openIssues', label: 'Open issues', sub: k => `(${k.issues} total)` },
  { key: 'deployments', label: 'Deployments done' },
  { key: 'pipeline', label: 'Changes in pipeline' },
  { key: 'avgAge', label: 'Avg age of open work', fmt: 'days' },
  { key: 'activeApps', label: 'Active applications', sub: k => `of ${k.totalApps}` + (k.unmappedActive ? `, +${k.unmappedActive} unmapped` : '') },
];

/* ========================================================================= */
/* STATE                                                                     */
/* ========================================================================= */
const state = {
  view: 'overview', period: null, filters: {}, sort: { key: 'age', dir: -1 },
  periods: [],      // [{period, shared:{fileName,publishedAt,tasks}|null, local:{...}|null}]
  local: new Map(), // period → IndexedDB record
  cache: new Map(), // period → {ds, snap, isLocal, stamp}
  idbOk: true, notice: '',
};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const todayYMD = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmtDate = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? String(iso) : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
const fmtNum = (v, fmt) => v == null ? '–' : fmt === 'pct' ? v.toFixed(1) + '%' : fmt === 'days' ? v.toFixed(1) + ' d' : Math.round(v).toLocaleString('en-GB');
function toast(msg, ms = 3200) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), ms); }

/* ========================================================================= */
/* LIBRARIES                                                                 */
/* ========================================================================= */
const scriptCache = new Map();
function loadScript(src) {
  if (scriptCache.has(src)) return scriptCache.get(src);
  const p = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = () => res(); s.onerror = () => { scriptCache.delete(src); s.remove(); rej(new Error('Could not load ' + src)); };
    document.head.append(s);
  });
  scriptCache.set(src, p); return p;
}
async function ensureLib(lib) {
  if (window[lib.global]) return window[lib.global];
  try { await loadScript(lib.local); } catch (e) { /* fall through */ }
  if (!window[lib.global] && LIBS.allowCdnFallback) { try { await loadScript(lib.cdn); } catch (e) { /* fall through */ } }
  return window[lib.global] || null;
}

/* ========================================================================= */
/* PERSISTENCE (IndexedDB; local uploads only, never the shared snapshot)    */
/* ========================================================================= */
const IDB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('IndexedDB unavailable'));
      const r = indexedDB.open('l2l3-kpi', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('uploads', { keyPath: 'period' });
      r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error);
    });
  },
  tx(mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction('uploads', mode); const st = t.objectStore('uploads');
      const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
    });
  },
  all() { return this.tx('readonly', s => s.getAll()); },
  put(rec) { return this.tx('readwrite', s => s.put(rec)); },
  clear() { return this.tx('readwrite', s => s.clear()); },
};

/* ========================================================================= */
/* DATA SOURCES                                                              */
/* ========================================================================= */
function sharedEntries() {
  const m = new Map();
  for (const e of window.TRACKER_HISTORY_INDEX || []) m.set(e.period, { fileName: e.fileName, publishedAt: e.publishedAt, tasks: e.tasks });
  const s = window.TRACKER_SNAPSHOT;
  if (s && s.period) m.set(s.period, { fileName: s.fileName, publishedAt: s.publishedAt, latest: true });
  return m;
}
function buildPeriods() {
  const shared = sharedEntries();
  const all = new Set([...shared.keys(), ...state.local.keys()]);
  state.periods = [...all].map(p => {
    const sh = shared.get(p) || null, lo = state.local.get(p) || null;
    const useLocal = !!lo && (!sh || String(lo.uploadedAt) > String(sh.publishedAt || ''));
    return { period: p, shared: sh, local: lo, useLocal };
  }).sort((a, b) => b.period.localeCompare(a.period));
}
const periodInfo = p => state.periods.find(x => x.period === p);
async function loadSnap(p) {
  const info = periodInfo(p);
  if (!info) return null;
  if (info.useLocal) return { snap: info.local, isLocal: true, stamp: info.local.uploadedAt };
  const s = window.TRACKER_SNAPSHOT;
  if (s && s.period === p) return { snap: s, isLocal: false, stamp: s.publishedAt };
  window.TRACKER_HISTORY = window.TRACKER_HISTORY || {};
  if (!window.TRACKER_HISTORY[p]) await loadScript(`data/history/${p}.js`); // script injection keeps file:// working
  const h = window.TRACKER_HISTORY[p];
  return h ? { snap: h, isLocal: false, stamp: h.publishedAt } : null;
}
async function getDataset(p) {
  if (state.cache.has(p)) return state.cache.get(p);
  const src = await loadSnap(p).catch(() => null);
  if (!src) return null;
  const ds = C.normalize(src.snap.sheets);
  C.applyAges(ds.tasks, C.refDateFor(p, todayYMD()));
  const entry = { ds, ...src };
  state.cache.set(p, entry);
  return entry;
}
const prevPeriod = p => { const list = state.periods.map(x => x.period).sort(); const i = list.indexOf(p); return i > 0 ? list[i - 1] : null; };

/* ========================================================================= */
/* ROUTING (#view?key=value…)                                                */
/* ========================================================================= */
function parseHash() {
  const raw = location.hash.slice(1), qi = raw.indexOf('?');
  const v = decodeURIComponent(qi < 0 ? raw : raw.slice(0, qi)), qs = qi < 0 ? '' : raw.slice(qi + 1);
  const params = new URLSearchParams(qs || '');
  const filters = {};
  FILTER_KEYS.forEach(k => { if (params.get(k)) filters[k] = params.get(k); });
  return { view: VIEWS.some(x => x.id === v) ? v : 'overview', filters, period: params.get('period') || null };
}
function buildHash(s) {
  const p = new URLSearchParams();
  FILTER_KEYS.forEach(k => { if (s.filters[k]) p.set(k, s.filters[k]); });
  if (s.period && s.period !== (state.periods[0] || {}).period) p.set('period', s.period);
  const q = p.toString();
  return '#' + s.view + (q ? '?' + q : '');
}
function go(patch, { replace = false } = {}) {
  const next = { view: patch.view || state.view, period: 'period' in patch ? patch.period : state.period,
    filters: 'filters' in patch ? patch.filters : { ...state.filters, ...(patch.filter || {}) } };
  Object.keys(next.filters).forEach(k => { if (!next.filters[k]) delete next.filters[k]; });
  const h = buildHash(next);
  if (h === location.hash) return render();
  if (replace) { history.replaceState(null, '', h); render(); } else location.hash = h; // hashchange → render
}
window.addEventListener('hashchange', () => render());

/* ========================================================================= */
/* RENDER                                                                    */
/* ========================================================================= */
let renderSeq = 0;
async function render() {
  const seq = ++renderSeq;
  const h = parseHash();
  state.view = h.view; state.filters = h.filters; state.notice = '';
  const avail = state.periods.map(x => x.period);
  if (h.period && !avail.includes(h.period)) state.notice = `${C.periodLabel(h.period)} isn't published here; showing the latest month instead.`;
  state.period = h.period && avail.includes(h.period) ? h.period : (avail[0] || null);

  renderTabs(); renderPeriodSelect();
  const view = $('#view');
  if (!state.period) { renderBanner(null); $('#filters').innerHTML = ''; $('#chips').innerHTML = ''; destroyCharts(); view.innerHTML = emptyState(); return; }

  const cur = await getDataset(state.period);
  if (seq !== renderSeq) return;
  if (!cur) { renderBanner(null); destroyCharts(); view.innerHTML = `<div class="empty"><h2>Couldn't load ${esc(C.periodLabel(state.period))}</h2><p class="muted">data/history/${esc(state.period)}.js is missing. Pick another month or upload the tracker.</p></div>`; return; }
  const prevP = prevPeriod(state.period);
  const prev = prevP ? await getDataset(prevP) : null;
  if (seq !== renderSeq) return;

  renderBanner(cur); renderFilters(cur.ds); renderChips(cur.ds);
  const ctx = makeCtx(cur, prev, prevP);
  lastCtx = ctx;
  destroyCharts();
  document.body.dataset.view = state.view;
  const V = { overview: viewOverview, domain: viewDomain, application: viewApplication, team: viewTeam, trends: viewTrends, quality: viewQuality, print: viewPrint }[state.view];
  await V(view, ctx, seq);
}
function makeCtx(cur, prev, prevP) {
  const filters = state.filters;
  const list = C.applyFilters(cur.ds.tasks, filters, cur.ds);
  const agg = C.aggregate(list, cur.ds);
  let prevAgg = null;
  if (prev) { const { qc, ...pf } = filters; prevAgg = C.aggregate(C.applyFilters(prev.ds.tasks, pf, prev.ds), prev.ds); }
  return { cur, ds: cur.ds, list, agg, prevAgg, prevP };
}

function renderFilters(ds) {

  const types = uniq(ds.tasks.map(t => t.type).filter(Boolean));
  const people = new Map();

  $('#filters').innerHTML = `

    <label>Application<select data-f="app">${opt(apps, f.app, 'All applications')}</select></label>

/* ---------- shared fragments ---------- */
function kpiCards(k, pk) {
  return `<div class="kpis">${KPI_CARDS.map(c => {
    const v = k[c.key];
    let d = '';
    if (pk && v != null && pk[c.key] != null) {
      const diff = v - pk[c.key], dir = CFG.kpiDirection[c.key] || 'neutral';
      const cls = Math.abs(diff) < 1e-9 || dir === 'neutral' ? 'neutral' : (diff > 0) === (dir === 'up') ? 'good' : 'bad';
      const amt = c.fmt === 'pct' ? Math.abs(diff).toFixed(1) + ' pp' : c.fmt === 'days' ? Math.abs(diff).toFixed(1) + ' d' : Math.abs(Math.round(diff));
      d = `<div class="d ${cls}">${Math.abs(diff) < 1e-9 ? 'no change' : (diff > 0 ? '▲ ' : '▼ ') + amt} vs prev.</div>`;
    }
    return `<div class="kpi"><div class="v">${fmtNum(v, c.fmt)}</div><div class="l">${c.label}${c.sub ? ' <span class="num">' + esc(c.sub(k)) + '</span>' : ''}</div>${d}</div>`;
  }).join('')}</div>`;
}
function sbar(t) {
  const parts = CFG.bucketOrder.map(b => [b, t.filter(x => x.bucket === b).length]).filter(x => x[1]);
  const total = t.length || 1;
  return `<div class="sbar" role="img" aria-label="${esc(parts.map(([b, n]) => `${b} ${n}`).join(', '))}">${parts.map(([b, n]) => `<span style="width:${(n / total) * 100}%;background:var(${STATUS_COLOR[b]})" title="${b}: ${n}"></span>`).join('')}</div>`;
}
function statusLegend() { return `<div class="legend">${CFG.bucketOrder.filter(b => b !== 'Unknown').map(b => `<span><i style="background:var(${STATUS_COLOR[b]})"></i>${b}</span>`).join('')}</div>`; }
function domainCards(ctx) {
  return `<div class="domains">${ctx.agg.byDomain.map(d => {
    const ts = ctx.list.filter(t => t.domain === d.domain);
    const active = C.normKey(state.filters.domain) === C.normKey(d.domain);
    return `<button type="button" class="dcard" data-domain="${esc(d.domain)}" aria-pressed="${active}">
      <h3><span>${esc(d.domain)}</span><span class="meta num">${d.apps.length} app${d.apps.length === 1 ? '' : 's'}</span></h3>
      <div class="big">${d.total}</div>
      ${sbar(ts)}
      <div class="meta num">${d.done} done, ${d.open} open, ${d.openIssues} open issue${d.openIssues === 1 ? '' : 's'}${d.avgAge != null ? `, avg age ${d.avgAge.toFixed(0)} d` : ''}</div>
    </button>`;
  }).join('') || '<p class="muted">No tasks match these filters.</p>'}</div>`;
}
function ticketHtml(t) {
  if (!t.tickets.length) return '<span class="flag">none</span>';
  return t.tickets.map(id => { const u = C.ticketUrl(id); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(id)}</a>` : esc(id); }).join('<br>');
}
function statusPill(t) { return `<span class="status" style="background:var(${STATUS_COLOR[t.bucket]})" title="${esc(t.status || 'blank')}">${esc(t.status || 'blank')}</span>`; }
function ageHtml(t) { return t.age == null ? '' : `<span class="${t.age > CFG.ageHighlightDays ? 'age-hot' : ''}">${t.age}</span>`; }
const COLS = [
  { key: 'ticket', label: 'Ticket', val: t => t.tickets.join(' '), html: ticketHtml },
  { key: 'task', label: 'Task', val: t => t.task, html: t => esc(t.task) + (t.flags.length ? ` <span class="flag" title="${esc(t.flags.join(', '))}">⚑</span>` : ''), cls: 'task' },
  { key: 'type', label: 'Type', val: t => t.type, html: t => esc(t.type) },

  { key: 'status', label: 'Status', val: t => CFG.bucketOrder.indexOf(t.bucket), html: statusPill },
  { key: 'poc', label: 'POC', val: t => t.pocRaw, html: t => esc(t.pocRaw) },
  { key: 'shadow', label: 'Shadowing', val: t => t.shadowRaw, html: t => esc(t.shadowRaw) },
  { key: 'age', label: 'Age (d)', val: t => t.age == null ? -1 : t.age, html: ageHtml, cls: 'n' },
];
function taskTable(list) {
  const { key, dir } = state.sort, col = COLS.find(c => c.key === key) || COLS[9];
  const rows = [...list].sort((a, b) => { const x = col.val(a), y = col.val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
  return `<div class="table-wrap"><table><thead><tr>${COLS.map(c => `<th data-sort="${c.key}" class="${c.cls === 'n' ? 'n' : ''}" aria-sort="${c.key === key ? (dir > 0 ? 'ascending' : 'descending') : 'none'}">${c.label}${c.key === key ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(t => `<tr>${COLS.map(c => `<td class="${c.cls || ''}">${c.html(t)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${COLS.length}" class="muted">No tasks match these filters.</td></tr>`}</tbody></table></div>`;
}

function domainBreakdown(ctx, compact = false) {
  return `<div class="table-wrap"><table><thead><tr><th>Domain / application</th><th class="n">Total</th><th class="n">Done</th><th class="n">Open</th><th class="n">Done %</th><th class="n">Open issues</th>${compact ? '' : '<th class="n">Deployments</th>'}<th class="n">Avg age</th></tr></thead><tbody>

async function viewTrends(el, ctx, seq) {

      ${rows.slice().reverse().map(r => `<tr class="click" data-period="${r.p}"><td>${esc(C.periodLabel(r.p))}</td>${KPI_CARDS.map(c => `<td class="n">${fmtNum(r.a.kpis[c.key], c.fmt)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;

  chart('tr-vol', { type: 'line', data: { labels, datasets: [line('Total', rows.map(r => r.a.kpis.total), css('--brand')), line('Done', rows.map(r => r.a.kpis.done), css('--s-done')), line('Open', rows.map(r => r.a.kpis.open), css('--s-pending'))] } });
  chart('tr-rate', { type: 'line', data: { labels, datasets: [line('Completion %', rows.map(r => +r.a.kpis.completionRate.toFixed(1)), css('--s-done'))] }, options: { scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } } });
  chart('tr-iss', { type: 'bar', data: { labels, datasets: [{ label: 'Open issues', data: rows.map(r => r.a.kpis.openIssues), backgroundColor: css('--accent') }] }, options: { plugins: { legend: { display: false } } } });
  chart('tr-age', { type: 'line', data: { labels, datasets: [line('Avg age', rows.map(r => r.a.kpis.avgAge == null ? null : +r.a.kpis.avgAge.toFixed(1)), css('--warn'))] }, options: { plugins: { legend: { display: false } } } });
  const doms = [...new Set(rows.flatMap(r => r.a.byDomain.map(d => d.domain)))];
  const pal = ['#0b2d6b', '#2f6fd6', '#1d8a4b', '#e3a21a', '#8e44ad', '#e2001a', '#16a3b8', '#8b95a9'];
  chart('tr-dom', { type: 'bar', data: { labels, datasets: doms.map((d, i) => ({ label: d, data: rows.map(r => (r.a.byDomain.find(x => x.domain === d) || { total: 0 }).total), backgroundColor: pal[i % pal.length] })) },
    options: { scales: { x: { stacked: true }, y: { stacked: true } } } });
}
function viewQuality(el, ctx) {
  const q = ctx.ds.quality;
  el.innerHTML = `<section class="block"><h2>Data quality checks for ${esc(C.periodLabel(state.period))}</h2>
    <p class="muted" style="margin-top:-6px">Counts cover the whole file. Select a check to list its tasks.</p>
    <div class="qlist">${q.checks.map(c => `<button type="button" class="qitem ${c.idx.length ? (c.info ? '' : 'warn') : 'ok'}" data-qc="${c.id}" aria-pressed="${state.filters.qc === c.id}">
      <div class="c">${c.idx.length}</div><div>${esc(c.label)}${c.info ? ' <span class="muted">(info)</span>' : ''}</div>
      ${c.detail && c.detail.length ? `<small>${esc(c.detail.slice(0, 6).join('; '))}${c.detail.length > 6 ? ` and ${c.detail.length - 6} more` : ''}</small>` : ''}</button>`).join('')}</div>
    <p class="muted" style="font-size:.82rem;margin-bottom:0">Sheets used: tasks “${esc(ctx.ds.meta.tasksSheet || 'not found')}”, mapping “${esc(ctx.ds.meta.mappingSheet || 'not found')}”, team “${esc(ctx.ds.meta.teamSheet || 'none')}”.</p></section>` +
    (state.filters.qc ? tasksBlock(ctx, 'Tasks for this check') : '');
}
function viewPrint(el, ctx) {
  el.innerHTML = `<div class="actions no-print" style="margin-bottom:12px"><button class="btn btn-primary" type="button" onclick="window.print()">Print / PDF</button><span class="muted">A4 landscape. Filters apply.</span></div>` +
    kpiCards(ctx.agg.kpis, ctx.prevAgg && ctx.prevAgg.kpis) + domainCards(ctx) +
    `<div class="print-cols grid-2"><section class="block"><h2>Domain breakdown</h2>${domainBreakdown(ctx, true)}</section>
     <section class="block"><h2>Top open issues by age</h2>${topIssues(ctx)}</section></div>`;
}

/* ---------- view interactions (event delegation) ---------- */
$('#view').addEventListener('click', e => {
  const t = e.target;
  if (t.closest('a')) return;
  const th = t.closest('th[data-sort]');
  if (th) { const k = th.dataset.sort; state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : (k === 'age' ? -1 : 1) }; $('#task-table').innerHTML = taskTable(lastCtx.list); return; }
  const ex = t.closest('[data-export]'); if (ex) return ex.dataset.export === 'tasks' ? exportTasks() : exportKpis();
  const qc = t.closest('[data-qc]'); if (qc) return go({ filter: { qc: state.filters.qc === qc.dataset.qc ? '' : qc.dataset.qc } });
  const per = t.closest('[data-period]'); if (per) return go({ view: 'overview', period: per.dataset.period });
  const person = t.closest('[data-person]'); if (person) return go({ filter: { person: person.dataset.person } });
  const app = t.closest('[data-app]'); if (app) return go({ view: state.view === 'overview' || state.view === 'print' ? 'application' : state.view, filter: { app: app.dataset.app, domain: app.dataset.domain || state.filters.domain } });
  const dom = t.closest('[data-domain]');
  if (dom && state.view !== 'print') {
    const same = C.normKey(state.filters.domain) === C.normKey(dom.dataset.domain);
    return go({ view: state.view === 'overview' ? 'domain' : state.view, filter: { domain: same && state.view !== 'overview' ? '' : dom.dataset.domain, app: '' } });
  }
});

/* ========================================================================= */
/* CHARTS                                                                    */
/* ========================================================================= */
const charts = new Map();
let lastCtx = null;
function destroyCharts() { charts.forEach(c => c.destroy()); charts.clear(); }
function chart(id, cfg) {
  const el = document.getElementById(id);
  if (!el) return;
  if (!window.Chart) { el.parentElement.innerHTML = '<div class="chart-msg">Charts are unavailable: Chart.js could not be loaded. Run <code>npm run vendor</code> or check the network.</div>'; return; }
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, animation: false, plugins: {} }, cfg.options || {});
  cfg.options.plugins = Object.assign({ legend: { position: 'bottom', labels: { boxWidth: 12 } } }, cfg.options.plugins);
  charts.set(id, new window.Chart(el, cfg));
}
function stackedStatus(id, labels, tasksFor, onPick, horizontal) {
  chart(id, { type: 'bar', data: { labels, datasets: CFG.bucketOrder.map(b => ({ label: b, data: labels.map(l => tasksFor(l).filter(t => t.bucket === b).length), backgroundColor: css(STATUS_COLOR[b]) })).filter(d => d.data.some(Boolean)) },
    options: { indexAxis: horizontal ? 'y' : 'x', scales: { x: { stacked: true }, y: { stacked: true } }, plugins: { legend: { display: false } },
      onClick: (e, els) => { if (els.length) onPick(labels[els[0].index]); } } });
}
function agingChart(id, aging) {
  chart(id, { type: 'bar', data: { labels: aging.map(a => a.label), datasets: [{ label: 'Open tasks', data: aging.map(a => a.count), backgroundColor: ['#9cc5a7', '#e3c15a', '#ec9443', '#c62828'] }] }, options: { plugins: { legend: { display: false } } } });
}

/* ========================================================================= */
/* EXPORT                                                                    */
/* ========================================================================= */
function download(name, text, type = 'text/plain') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const csvCell = v => { const s = String(v == null ? '' : v); return /[",\r\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
const toCsv = rows => '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
function fileStem() { const f = FILTER_KEYS.filter(k => state.filters[k]).map(k => state.filters[k]).join('_'); return `L2L3_${state.period}_${state.view}${f ? '_' + f.replace(/[^\w-]+/g, '-') : ''}`; }
function exportTasks() {
  const rows = [['Ticket ID', 'Task', 'Type', 'Application', 'Domain (normalized)', 'Domain (sheet)', 'Date', 'Status', 'Status bucket', 'POC', 'Shadowing', 'Age (days)', 'Flags']];
  lastCtx.list.forEach(t => rows.push([t.ticketRaw, t.task, t.type, t.app, t.domain, t.domainColumn, t.date || t.dateRaw, t.status, t.bucket, t.pocRaw, t.shadowRaw, t.age == null ? '' : t.age, t.flags.join(' ')]));
  download(fileStem() + '_tasks.csv', toCsv(rows), 'text/csv;charset=utf-8');
}
function exportKpis() {
  const k = lastCtx.agg.kpis, pk = lastCtx.prevAgg && lastCtx.prevAgg.kpis;
  const rows = [['Section', 'Name', 'Value', 'Previous month', 'Change']];
  KPI_CARDS.forEach(c => rows.push(['KPI', c.label, k[c.key] == null ? '' : +(+k[c.key]).toFixed(2), pk && pk[c.key] != null ? +(+pk[c.key]).toFixed(2) : '', pk && pk[c.key] != null && k[c.key] != null ? +(k[c.key] - pk[c.key]).toFixed(2) : '']));
  const v = state.view;
  if (v === 'application') lastCtx.agg.byApp.forEach(a => rows.push(['Application', a.app, a.total, '', '', a.domain, a.done, a.open, a.openIssues]));
  else if (v === 'team') lastCtx.agg.team.members.forEach(p => rows.push(['Person', p.name, p.total, '', '', 'POC ' + p.poc, 'Shadowing ' + p.shadow, 'Open ' + p.open]));
  else lastCtx.agg.byDomain.forEach(d => { rows.push(['Domain', d.domain, d.total, '', '', 'done ' + d.done, 'open ' + d.open, 'open issues ' + d.openIssues]); });
  download(fileStem() + '_kpis.csv', toCsv(rows), 'text/csv;charset=utf-8');
}

/* ========================================================================= */
/* UPLOAD / PUBLISH / CLEAR                                                  */
/* ========================================================================= */
async function handleFile(file) {
  if (!file) return;
  const XLSX = await ensureLib(LIBS.xlsx);
  if (!XLSX) return toast('The Excel reader (SheetJS) could not be loaded. Run npm run vendor, or check the network.', 6000);
  try {
    const wb = XLSX.read(await file.arrayBuffer(), C.READ_OPTS);
    const sheets = C.sheetsFromWorkbook(wb, XLSX);
    const det = C.detectSheets(sheets);
    if (!det.tasksSheet) return toast('No task sheet found: the file needs a sheet with a TASK column.', 6000);
    const period = C.detectPeriod(file.name, sheets);
    if (!period) return toast('Could not tell the month: name the file “… <Month> <Year>.xlsx” or fill the Date column.', 6000);
    const rec = { period, fileName: file.name, uploadedAt: new Date().toISOString(), sheets };
    state.local.set(period, rec); state.cache.delete(period);
    if (state.idbOk) await IDB.put(rec).catch(() => { state.idbOk = false; });
    buildPeriods();
    toast(`Loaded ${file.name} as ${C.periodLabel(period)}.`);
    go({ period, filters: {} });
  } catch (err) { console.error(err); toast('This file could not be read: ' + err.message, 6000); }
}
$('#btn-upload').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { handleFile(e.target.files[0]); e.target.value = ''; });
['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, e => { if ([...(e.dataTransfer.types || [])].includes('Files')) { e.preventDefault(); document.body.classList.add('dragging'); } }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { if (ev === 'dragleave' && e.relatedTarget) return; document.body.classList.remove('dragging'); }));
document.addEventListener('drop', e => { if (e.dataTransfer.files.length) { e.preventDefault(); handleFile(e.dataTransfer.files[0]); } });

$('#btn-publish').addEventListener('click', async () => {
  const cur = await getDataset(state.period); if (!cur) return;
  const snap = { fileName: cur.snap.fileName, period: state.period, publishedAt: new Date().toISOString(), sheets: cur.snap.sheets };
  const entry = { period: snap.period, fileName: snap.fileName, publishedAt: snap.publishedAt, tasks: cur.ds.tasks.length };
  const index = C.mergeIndex(window.TRACKER_HISTORY_INDEX || [], entry);
  const latestP = (window.TRACKER_SNAPSHOT || {}).period;
  const isLatest = !latestP || snap.period >= latestP;
  const files = [];
  if (isLatest) files.push(['latest.js', C.snapshotJs(snap), 'data/']);
  files.push([`${snap.period}.js`, C.historyJs(snap), 'data/history/'], ['index.js', C.historyIndexJs(index), 'data/history/']);
  files.forEach(([n, txt], i) => setTimeout(() => download(n, txt, 'text/javascript'), i * 400));
  const dlg = $('#dlg');
  dlg.innerHTML = `<h2 style="margin-top:0">Publish ${esc(C.periodLabel(snap.period))}</h2>
    <p>${files.length} files are downloading. If the browser asks, allow multiple downloads. Move them into the repo:</p>
    <ul>${files.map(([n, , d]) => `<li><code>${esc(n)}</code> → <code>${d}${esc(n)}</code></li>`).join('')}</ul>
    ${isLatest ? '' : `<p class="muted">${esc(C.periodLabel(latestP))} is newer, so <code>data/latest.js</code> stays as it is.</p>`}
    <p>Then commit and push: <code>git add data && git commit -m "Publish ${snap.period}" && git push</code></p>
    <p class="muted">Simpler: drop the .xlsx into <code>data/inbox/</code> and push; the GitHub Action publishes it.</p>
    <form method="dialog" style="text-align:right"><button class="btn btn-primary">Done</button></form>`;
  dlg.showModal();
});
$('#btn-clear').addEventListener('click', async () => {
  if (!state.local.size) return toast('There are no local uploads to clear.');
  if (!confirm(`Remove ${state.local.size} local upload${state.local.size === 1 ? '' : 's'} from this browser? Published data is not affected.`)) return;
  if (state.idbOk) await IDB.clear().catch(() => {});
  state.local.clear(); state.cache.clear(); buildPeriods();
  toast('Local uploads cleared.'); go({ period: null });
});
$('#btn-print').addEventListener('click', () => {
  if (state.view === 'print') return window.print();
  go({ view: 'print' });
  setTimeout(() => window.print(), 500);
});

/* ========================================================================= */
/* BOOT                                                                      */
/* ========================================================================= */
(async function boot() {
  try { await IDB.open(); (await IDB.all() || []).forEach(r => state.local.set(r.period, r)); }
  catch (e) { state.idbOk = false; }
  buildPeriods();
  await ensureLib(LIBS.chart);
  await render();
})();
</script>
